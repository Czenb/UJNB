name: ARM64 runner probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  architecture:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Check ARM64 host
        shell: bash
        run: |
          printf 'runner.os=%s\nrunner.arch=%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          uname -m
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64

  emulator:
    needs: architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check ARM64 app support in accelerated Android 35 emulator
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 \
            -type f -name sdkmanager -print -quit)
          test -n "$sdkmanager_path"
          export PATH="$(dirname "$sdkmanager_path"):$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          printf 'y\n%.0s' {1..20} | sdkmanager --licenses > "$RUNNER_TEMP/sdk-licenses.log"
          sdkmanager --install 'system-images;android-35;google_apis;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/ujnb-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd -n ujnb-b40-smoke \
            -k 'system-images;android-35;google_apis;x86_64' -d pixel_4 -f
          "$ANDROID_HOME/emulator/emulator" -list-avds
          test -f "$ANDROID_AVD_HOME/ujnb-b40-smoke.ini"
          "$ANDROID_HOME/emulator/emulator" -avd ujnb-b40-smoke -port 5558 \
            -no-window -no-audio -no-snapshot -no-boot-anim -accel on \
            -gpu swiftshader_indirect -memory 2048 -partition-size 2048 \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 200); do
            if [ "$(adb -s emulator-5558 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              ready=1
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 80 "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          abi=$(adb -s emulator-5558 shell getprop ro.product.cpu.abilist | tr -d '\r')
          bridge=$(adb -s emulator-5558 shell getprop ro.dalvik.vm.native.bridge | tr -d '\r')
          qemu=$(adb -s emulator-5558 shell getprop ro.kernel.qemu | tr -d '\r')
          printf 'booted=1 abilist=%s native.bridge=%s qemu=%s\n' "$abi" "$bridge" "$qemu"
          test "$qemu" = 1
          case ",$abi," in *,arm64-v8a,*) ;; *) exit 2 ;; esac
          bash .github/scripts/native-bridge-probe.sh emulator-5558
