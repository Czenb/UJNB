name: B40 isolated Android QA

on:
  workflow_dispatch:
    inputs:
      encrypted_asset_id:
        description: Draft release asset ID for the encrypted B40 QA input
        required: true
        type: string

permissions:
  contents: read

jobs:
  final-apk:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: b40-qa
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Fetch and verify encrypted QA input
        id: fetch
        shell: bash
        env:
          QA_ASSET_ID: ${{ inputs.encrypted_asset_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = X64
          [[ "$QA_ASSET_ID" =~ ^[0-9]+$ ]]
          workdir=$(mktemp -d "$RUNNER_TEMP/b40qa.XXXXXX")
          echo "workdir=$workdir" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/octet-stream' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/Czenb/UJNB/releases/assets/$QA_ASSET_ID" \
            --output "$workdir/input.aesgcm"
          printf '%s  %s\n' \
            ed3ad2472020e2694f082a8c1806f6812807426fee6bac2993256112773fc4ae \
            "$workdir/input.aesgcm" | sha256sum -c -
      - name: Authenticate and decrypt QA input
        shell: bash
        env:
          QA_WORKDIR: ${{ steps.fetch.outputs.workdir }}
          UJNB_B40_QA_KEY: ${{ secrets.UJNB_B40_QA_KEY }}
        run: |
          set -euo pipefail
          test -d "$QA_WORKDIR"
          node "$GITHUB_WORKSPACE/.github/scripts/qa-crypto.mjs" decrypt \
            "$QA_WORKDIR/input.aesgcm" "$QA_WORKDIR/input.tar.gz"
          printf '%s  %s\n' \
            f75382db38c948492189b2b909ed9254ff5d16e80acf6300762295040dfaaeee \
            "$QA_WORKDIR/input.tar.gz" | sha256sum -c -
      - name: Run isolated final APK tests
        shell: bash
        env:
          QA_WORKDIR: ${{ steps.fetch.outputs.workdir }}
        run: |
          set -euo pipefail
          workdir=$QA_WORKDIR
          test -d "$workdir"
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          emulator_pid=
          trap 'if [ -n "$emulator_pid" ]; then kill "$emulator_pid" 2>/dev/null || true; fi' EXIT
          expected=$(printf '%s\n' \
            app/build/outputs/apk/release/app-release.apk \
            release-tests/build/outputs/apk/release/release-tests-release.apk \
            app/build/outputs/androidTest-results/shell-evaluation/symbols.txt \
            scripts/test-release.sh scripts/test-resigned.py scripts/emulator_target.py | sort)
          actual=$(tar -tzf "$workdir/input.tar.gz" | sort)
          test "$actual" = "$expected"
          mkdir "$workdir/source"
          tar -xzf "$workdir/input.tar.gz" -C "$workdir/source"
          cd "$workdir/source"
          sha256sum -c - <<'SHA256SUMS'
          9fbef0397928878f09e74d3cc58e55c2be87f3ca6575cc6767202b685b64e6fc  app/build/outputs/apk/release/app-release.apk
          a36ff77963bef8830fb355b07ee44e1427d5575ea2ec81779e3fe75bd70fb9ac  release-tests/build/outputs/apk/release/release-tests-release.apk
          01fe196e103ba4be3fb627a906614d707d82db6ab018bba7a29f5470242fba2b  app/build/outputs/androidTest-results/shell-evaluation/symbols.txt
          b6f0e7bf1a5e770e64d6a9f542c42e36da4ee681cb8dbac9e5b6609b59571506  scripts/test-release.sh
          26c5f73d4d47c4f2d50a3fe7c5d575a821180c3a0eee576a3337a7fef4857263  scripts/test-resigned.py
          abb8ce27e4d6a5a122c1f65d287e95c5b881f799f83a4767ed7bb8cb6631b99b  scripts/emulator_target.py
          SHA256SUMS
          ln app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/androidTest-results/shell-evaluation/candidate.apk
          perl -pi -e 's/\r\n/\n/g' scripts/test-release.sh

          command -v timeout
          command -v sha256sum
          sdkmanager_path=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 \
            -type f -name sdkmanager -print -quit)
          test -n "$sdkmanager_path"
          export PATH="$(dirname "$sdkmanager_path"):$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          printf 'y\n%.0s' {1..20} | sdkmanager --licenses > "$workdir/sdk-licenses.log"
          sdkmanager --install 'system-images;android-35;google_apis;x86_64' 'build-tools;36.0.0'
          export ANDROID_AVD_HOME="$workdir/avds"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd -n ujnb-b40-qa \
            -k 'system-images;android-35;google_apis;x86_64' -d pixel_4 -f
          "$ANDROID_HOME/emulator/emulator" -avd ujnb-b40-qa -port 5558 \
            -no-window -no-audio -no-snapshot -no-boot-anim -accel on \
            -gpu swiftshader_indirect -memory 2048 -partition-size 2048 \
            > "$workdir/emulator.log" 2>&1 &
          emulator_pid=$!
          ready=0
          for attempt in $(seq 1 120); do
            if [ "$(adb -s emulator-5558 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              ready=1
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then tail -n 80 "$workdir/emulator.log"; exit 1; fi
          test "$(adb -s emulator-5558 shell getprop ro.kernel.qemu | tr -d '\r')" = 1
          abi=$(adb -s emulator-5558 shell getprop ro.product.cpu.abilist | tr -d '\r')
          bridge=$(adb -s emulator-5558 shell getprop ro.dalvik.vm.native.bridge | tr -d '\r')
          case ",$abi," in *,arm64-v8a,*) ;; *) echo 'ARM64 ABI missing' >&2; exit 1 ;; esac
          test "$bridge" = libndk_translation.so
          bash "$GITHUB_WORKSPACE/.github/scripts/native-bridge-probe.sh" emulator-5558
          keytool -genkeypair -noprompt -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=Isolated QA' \
            > "$workdir/keytool.log" 2>&1
          export ANDROID_SERIAL=emulator-5558
          export UJNB_RELEASE_SKIP_BUILD=1 UJNB_TRANSFER_VARIANT=official
          export UJNB_RELEASE_SYMBOLS_FILE=app/build/outputs/androidTest-results/shell-evaluation/symbols.txt
          bash scripts/test-release.sh
          test -s app/build/outputs/androidTest-results/release-blackbox/resigned-result.txt
          printf 'B40 final APK SHA256=9fbef0397928878f09e74d3cc58e55c2be87f3ca6575cc6767202b685b64e6fc: 8 tests + resigned negative passed\n'
      - name: Remove QA plaintext and scratch files
        if: always()
        shell: bash
        env:
          QA_WORKDIR: ${{ steps.fetch.outputs.workdir }}
        run: |
          set -euo pipefail
          if [ -n "$QA_WORKDIR" ]; then
            case "$QA_WORKDIR" in
              "$RUNNER_TEMP"/b40qa.*) rm -rf -- "$QA_WORKDIR" ;;
              *) echo 'Refusing unexpected QA scratch path' >&2; exit 1 ;;
            esac
          fi
